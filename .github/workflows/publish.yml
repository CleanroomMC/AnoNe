name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Build
        run: ./gradlew build --no-configuration-cache -Pversioning.publish

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --workdir .
        env:
          OUTPUT: CHANGELOG.md
          CLIFF_INCLUDE_DATE: '1'
          GITHUB_REPO: ${{ github.repository }}

      - name: Attach any issue authors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import re
          import subprocess

          files = ('RELEASE_NOTES.md', 'CHANGELOG.md')
          line_re = re.compile(
              r'^(\s*)\*\[Fixes issue ((?:[\w.-]+/[\w.-]+)?#\d+)(?: by @([^\]]+))?\]\*\s*$'
          )
          default_repo = os.environ['GITHUB_REPOSITORY']
          authors = {}

          def lookup(ref):
              if ref in authors:
                  return authors[ref]
              if '/' in ref.split('#', 1)[0]:
                  repo, number = ref.split('#', 1)
              else:
                  repo, number = default_repo, ref[1:]
              result = subprocess.run(
                  ['gh', 'api', f'repos/{repo}/issues/{number}', '--jq', '.user.login'],
                  capture_output=True,
                  text=True,
              )
              login = result.stdout.strip() if result.returncode == 0 else ''
              authors[ref] = login
              return login

          for path in files:
              if not os.path.isfile(path):
                  continue
              with open(path, encoding='utf-8') as handle:
                  original = handle.read()
              rewritten = []
              changed = False
              for line in original.splitlines(keepends=True):
                  newline = '\n' if line.endswith('\n') else ''
                  match = line_re.match(line.rstrip('\n'))
                  if match is None or match.group(3):
                      rewritten.append(line)
                      continue
                  indent, ref = match.group(1), match.group(2)
                  login = lookup(ref)
                  if login:
                      rewritten.append(f'{indent}*[Fixes issue {ref} by @{login}]*{newline}')
                      changed = True
                  else:
                      rewritten.append(line)
              if changed:
                  with open(path, 'w', encoding='utf-8') as handle:
                      handle.write(''.join(rewritten))
          PY

      - name: Preflight destinations
        if: github.ref_type == 'tag'
        env:
          MAVEN_NAME: ${{ secrets.MAVEN_NAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(build/libs/*.jar)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release artifacts matched 'build/libs/*.jar'."
            exit 1
          fi
          if [ -z "${MAVEN_NAME}" ] || [ -z "${MAVEN_PASSWORD}" ]; then
            echo "::error::MAVEN_NAME or MAVEN_PASSWORD is not set."
            exit 1
          fi

      - name: Publish to Cleanroom Maven
        if: github.ref_type == 'tag'
        env:
          ORG_GRADLE_PROJECT_CleanroomUsername: ${{ secrets.MAVEN_NAME }}
          ORG_GRADLE_PROJECT_CleanroomPassword: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew publishAllPublicationsToCleanroomRepository --no-configuration-cache -Pversioning.publish

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(build/libs/*.jar)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release artifacts matched 'build/libs/*.jar'."
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md CHANGELOG.md "${files[@]}"
